# fly.toml — SixCall FastAPI backend
# Create the app once:  fly apps create sixcall-api
# Deploy:               fly deploy
# Secrets:              fly secrets set KEY=value ...

app = "sixcall-api"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  DOC_STORE_DIR = "/data/docs"
  SIXCALL_MARKDOWN_EXTRACT = "0"
  SIXCALL_OCR = "0"
  SIXCALL_USE_DB = "auto"
  SIXCALL_FOLLOWUPS = "0"
  REQUEST_DEADLINE_SEC = "90"
  LLM_ATTEMPT_TIMEOUT_SEC = "45"
  CORS_ORIGINS = "https://six-call.vercel.app"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"
  cpus = 2
  processes = ["app"]

# Persistent PDF/page cache across deploys.
# First time: fly volumes create sixcall_data --region bom --size 3
[[mounts]]
  source = "sixcall_data"
  destination = "/data"
  initial_size = "3gb"
